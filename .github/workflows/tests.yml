name: Tests

# Playwright-Tests der Web-App (Sync gegen WebDAV-Nachbau, Android-Variante, Bedienung).
# Läuft bei Pull Requests und wird von android.yml und deploy.yml vor dem Bauen aufgerufen:
# schlägt ein Test fehl, gibt es weder Release noch Web-Update.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Tests ausführen
        run: npm test

      - name: Testergebnisse sichern (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ergebnisse
          path: test-results/
          retention-days: 14
