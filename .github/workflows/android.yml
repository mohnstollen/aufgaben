name: Android-APK

# Baut die Android-App (Capacitor) und die Linux-Pakete (.deb/.rpm) aus der Web-App.
# - Bei jedem Push mit relevanten Änderungen: APK als Workflow-Artefakt
# - Auf main: automatisch ein GitHub-Release v<major>.<minor>.<Laufnummer> (major.minor aus package.json),
#   das die App über „Nach Updates suchen" findet
# - Ein von Hand angelegter Tag "v*" (z. B. v2.0.0) erzeugt ebenfalls ein Release
on:
  push:
    # Ohne "branches" würden bei gesetztem "tags"-Filter Branch-Pushes ignoriert
    branches: ["**"]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "android/**"
      - "linux/**"
      - "scripts/**"
      - "tests/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  apk:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-App in das Android-Projekt übernehmen
        run: npm run sync

      - name: Version bestimmen
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          RUN=${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME=${GITHUB_REF_NAME#v}; RELEASE_TAG=$GITHUB_REF_NAME
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION_NAME=$BASE.$RUN; RELEASE_TAG=v$VERSION_NAME
          else
            VERSION_NAME=$BASE.$RUN-dev.${GITHUB_SHA::7}; RELEASE_TAG=""
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$RUN" >> "$GITHUB_ENV"
          echo "Version $VERSION_NAME (Code $RUN)${RELEASE_TAG:+ → Release $RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Signier-Schlüssel bereitstellen
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK bauen (signiert)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Alias und Schlüssel-Passwort sind optional (Standard aus scripts/make-keystore.sh)
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'aufgaben' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aufgaben-$VERSION_NAME.apk"

      - name: APK bauen (Debug – kein Signier-Schlüssel hinterlegt)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          echo "::warning::Kein Signier-Schlüssel in den Secrets – es wird eine Debug-APK gebaut. Updates erfordern dann eine Neuinstallation (siehe README)."
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/aufgaben-$VERSION_NAME-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: aufgaben-apk-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/aufgaben-*.apk
          if-no-files-found: error

      # Nur signierte APKs werden veröffentlicht – sonst ließe sich das Update nicht über die App installieren
      - name: Release-Datei vorbereiten
        if: env.RELEASE_TAG != '' && env.HAS_KEYSTORE == 'true'
        run: cp "$RUNNER_TEMP/aufgaben-$VERSION_NAME.apk" "$RUNNER_TEMP/aufgaben.apk"

      - name: Release veröffentlichen
        if: env.RELEASE_TAG != '' && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Aufgaben ${{ env.VERSION_NAME }}
          files: ${{ runner.temp }}/aufgaben.apk
          generate_release_notes: true
          make_latest: true

  # Linux-Anwendung (GTK/WebKitGTK): .deb für Debian/Ubuntu/Mint, .rpm für Fedora
  linux:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version bestimmen
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          RUN=${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME=${GITHUB_REF_NAME#v}; RELEASE_TAG=$GITHUB_REF_NAME
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION_NAME=$BASE.$RUN; RELEASE_TAG=v$VERSION_NAME
          else
            VERSION_NAME=$BASE.$RUN-dev.${GITHUB_SHA::7}; RELEASE_TAG=""
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm xvfb xauth desktop-file-utils

      - name: Pakete bauen
        run: |
          desktop-file-validate linux/io.github.mohnstollen.aufgaben.desktop
          bash linux/build.sh "$VERSION_NAME"
          cp dist/aufgaben_*_all.deb "$RUNNER_TEMP/aufgaben.deb"
          cp dist/aufgaben-*.noarch.rpm "$RUNNER_TEMP/aufgaben.rpm"

      # Installiert das Paket samt Abhängigkeiten und prüft Sync (WebDAV + Nextcloud Tasks) am laufenden Programm
      - name: Paket installieren und testen
        run: |
          sudo apt-get install -y "$RUNNER_TEMP/aufgaben.deb"
          AUFGABEN_CMD=aufgaben node linux/test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: aufgaben-linux-${{ env.VERSION_NAME }}
          path: |
            ${{ runner.temp }}/aufgaben.deb
            ${{ runner.temp }}/aufgaben.rpm
          if-no-files-found: error

  # Hängt die Linux-Pakete an das Release (nach dem APK-Job, damit nicht zwei Jobs dasselbe Release anlegen)
  linux-release:
    needs: [apk, linux]
    if: needs.linux.outputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aufgaben-linux-*
          merge-multiple: true
          path: pakete

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.linux.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Aufgaben ${{ needs.linux.outputs.version_name }}
          files: |
            pakete/aufgaben.deb
            pakete/aufgaben.rpm
          generate_release_notes: true
          make_latest: true
