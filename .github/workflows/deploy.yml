name: Deploy to GitHub Pages

# Deployt den Inhalt des Repos automatisch auf GitHub Pages,
# sobald etwas auf den main-Branch gepusht wird.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Web-App zusammenstellen
        # Nur die Web-App veröffentlichen (ohne android/, scripts/ usw.)
        run: |
          node scripts/build-web.mjs
          cp -r .well-known .nojekyll www/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "www"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
