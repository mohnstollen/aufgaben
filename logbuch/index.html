<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Logbuch</title>
<style>
  :root{
    --bg:#0f1420; --surface:#1a2130; --surface2:#232c3d; --border:#2c3648;
    --text:#e6ebf2; --muted:#8b96a8; --accent:#4f8cff; --accent-hover:#3b7bf5;
    --green:#2fbf71; --red:#ff5c6c; --amber:#f0a132;
    --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#0f1420,#141b2b); color:var(--text);
    min-height:100vh; -webkit-text-size-adjust:100%;
  }
  header{
    padding:18px 0 12px; position:sticky; top:0; z-index:20;
    background:rgba(15,20,32,.88); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  h1{margin:0 0 3px; font-size:21px; letter-spacing:.3px}
  .sub{color:var(--muted); font-size:12.5px}
  .wrap{max-width:920px; margin:0 auto; padding:0 18px}
  .main{padding-top:18px; padding-bottom:70px}

  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);
  }
  .card.editing{border-color:var(--amber)}
  .editbar{
    display:none; align-items:center; gap:8px; margin:-4px 0 12px;
    font-size:12.5px; color:var(--amber);
  }
  .card.editing .editbar{display:flex}

  .row2{display:flex; gap:12px; flex-wrap:wrap}
  .field{margin-bottom:13px}
  .row2 .field{flex:1 1 150px; margin-bottom:13px}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px}
  input,textarea,select,button{font-family:inherit; font-size:14px}
  .field input,.field textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text);
  }
  .field textarea{min-height:140px; resize:vertical; line-height:1.5}
  .field input:focus,.field textarea:focus{outline:none; border-color:var(--accent)}
  .hint{font-size:11px; color:var(--muted); margin-top:5px}
  .ctxrow{display:flex; gap:8px; align-items:center}
  .ctxrow input{flex:1}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px}
  .chip{
    background:var(--surface2); border:1px solid var(--border); color:var(--muted);
    padding:4px 10px; border-radius:20px; font-size:12px; cursor:pointer;
  }
  .chip:hover{border-color:var(--accent); color:var(--text)}

  .actions{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
  .btn{padding:10px 17px; border-radius:10px; border:none; cursor:pointer; font-weight:500}
  .btn.primary{background:var(--accent); color:#fff}
  .btn.primary:hover{background:var(--accent-hover)}
  .btn.ghost{background:var(--surface2); color:var(--text); border:1px solid var(--border)}
  .btn.ghost:hover{border-color:var(--accent)}
  .spacer{flex:1}

  .section{margin-top:20px; display:none}
  .section.show{display:block}
  .listbar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:8px}
  .search{flex:1 1 200px; position:relative}
  .search input{
    width:100%; padding:11px 12px 11px 38px; border-radius:10px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
  }
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5}
  .ctrl{
    padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:13px; cursor:pointer;
  }
  .ctrl:hover{border-color:var(--accent)}
  .count{font-size:12.5px; color:var(--muted); margin:2px 0 12px}

  .list{display:flex; flex-direction:column; gap:9px}
  .note{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:var(--radius); padding:13px 15px; display:flex; gap:12px; align-items:flex-start;
    transition:.15s;
  }
  .note:hover{border-color:var(--accent)}
  .note.isediting{border-color:var(--amber); border-left-color:var(--amber)}
  .nbody{flex:1; min-width:0}
  .nmeta{font-size:12.5px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .ctxtag{
    display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px;
    font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid transparent;
  }
  .ctxtag:hover{filter:brightness(1.2)}
  .ntext{font-size:14.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word}
  .nactions{display:flex; gap:4px; flex-shrink:0}
  .iconbtn{
    background:transparent; border:none; color:var(--muted); cursor:pointer;
    padding:7px; border-radius:8px; display:grid; place-items:center;
  }
  .iconbtn:hover{background:var(--surface2); color:var(--text)}
  .iconbtn.del:hover{background:rgba(255,92,108,.15); color:var(--red)}
  .daygroup{font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);
    margin:16px 0 2px; padding-left:2px}
  .empty{text-align:center; color:var(--muted); padding:46px 20px; font-size:14px}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(90px);
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    padding:11px 18px; border-radius:12px; box-shadow:var(--shadow); z-index:60;
    font-size:14px; opacity:0; transition:.25s; display:flex; gap:12px; align-items:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0); opacity:1}
  .toast button{background:none;border:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
  #installBtn{display:none}
  @media(max-width:520px){
    .ntext{font-size:14px}
    .btn{flex:1 1 auto}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📓 Logbuch</h1>
    <div class="sub">Einträge werden lokal im Browser gespeichert (Local Storage).</div>
  </div>
</header>

<div class="wrap main">

  <!-- ===== Editor ===== -->
  <div class="card" id="editorCard">
    <div class="editbar">
      <span>✏️ Eintrag wird bearbeitet</span>
      <button class="chip" id="cancelEditBtn" style="margin-left:auto">Abbrechen</button>
    </div>

    <div class="row2">
      <div class="field">
        <label>Datum</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label>Uhrzeit</label>
        <input type="time" id="fTime">
      </div>
    </div>

    <div class="field">
      <label>Kontext</label>
      <div class="ctxrow">
        <input type="text" id="fCtx" list="ctxList" placeholder="z. B. Cabinets, LVSG, Lieferant X …" autocomplete="off">
        <datalist id="ctxList"></datalist>
      </div>
      <div class="chips" id="ctxChips"></div>
      <div class="hint">Optional. Bekannte Kontexte werden vorgeschlagen – für Querschnittsthemen einfach <code>#stichwort</code> in den Notiztext schreiben.</div>
    </div>

    <div class="field">
      <label>Notiz</label>
      <textarea id="fText" placeholder="Was ist passiert? (Strg + Enter speichert)"></textarea>
    </div>

    <div class="actions">
      <button class="btn primary" id="saveBtn">💾 Speichern</button>
      <button class="btn ghost" id="nowBtn" title="Datum/Uhrzeit auf jetzt setzen">🕒 Jetzt</button>
      <button class="btn ghost" id="clearBtn">Verwerfen</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="toggleListBtn">📖 Notizen anzeigen</button>
    </div>
  </div>

  <!-- ===== Liste ===== -->
  <div class="section" id="listSection">
    <div class="listbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Text oder Kontext durchsuchen…">
      </div>
      <select id="ctxFilter" class="ctrl"></select>
      <select id="sort" class="ctrl">
        <option value="desc">Neueste zuerst</option>
        <option value="asc">Älteste zuerst</option>
      </select>
      <button class="ctrl" id="exportBtn" title="Vollständiges Backup als JSON">⬇️ Export JSON</button>
      <button class="ctrl" id="exportTxtBtn" title="Lesbare Textdatei (gefilterte Ansicht)">📄 TXT</button>
      <button class="ctrl" id="exportCsvBtn" title="CSV für Excel (gefilterte Ansicht)">📊 CSV</button>
      <button class="ctrl" id="importBtn" title="JSON-Backup einlesen">⬆️ Import</button>
      <button class="ctrl" id="installBtn">📲 Installieren</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    </div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============ Storage ============ */
const LS_KEY = 'logbuch_v1';
const LS_LASTCTX = 'logbuch_lastctx';
let entries = load();
let editId = null;
let undoBuffer = null;

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if(!Array.isArray(d)) return [];
    return d.map(e => ({ context:'', ...e }));   // Migration v1 -> v2
  }catch(e){ return []; }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(entries)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const $ = id => document.getElementById(id);

/* ============ Kontext-Helfer ============ */
const NO_CTX = '— ohne Kontext —';

function normCtx(s){ return (s||'').trim().replace(/\s+/g,' '); }

/** Vereinheitlicht Schreibweisen: existiert der Kontext schon (case-insensitiv),
    wird die bereits gespeicherte Schreibweise übernommen. */
function canonicalCtx(s){
  const n = normCtx(s);
  if(!n) return '';
  const hit = allContexts().find(c => c.toLowerCase() === n.toLowerCase());
  return hit || n;
}
function allContexts(){
  const set = new Map();
  entries.forEach(e=>{
    const c = normCtx(e.context);
    if(c && !set.has(c.toLowerCase())) set.set(c.toLowerCase(), c);
  });
  return [...set.values()].sort((a,b)=>a.localeCompare(b,'de'));
}
/** Stabile Farbe je Kontext (Hash -> HSL) */
function ctxColor(ctx){
  let h = 0;
  for(let i=0;i<ctx.length;i++) h = (h*31 + ctx.charCodeAt(i)) % 360;
  return { bg:`hsl(${h} 60% 22%)`, fg:`hsl(${h} 85% 78%)`, line:`hsl(${h} 70% 55%)` };
}

/* ============ Datum ============ */
function pad(n){ return String(n).padStart(2,'0'); }
function setNow(){
  const d = new Date();
  $('fDate').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  $('fTime').value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function stampOf(e){ return new Date(`${e.date}T${e.time||'00:00'}:00`); }
function fmtDate(dt){ return dt.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtTime(dt){ return dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }

/* ============ Speichern / Bearbeiten ============ */
function saveEntry(){
  const text = $('fText').value.trim();
  if(!text){ $('fText').focus(); toast('Bitte zuerst eine Notiz eingeben.'); return; }
  const date = $('fDate').value || new Date().toISOString().slice(0,10);
  const time = $('fTime').value || '00:00';
  const context = canonicalCtx($('fCtx').value);

  if(editId){
    const e = entries.find(x=>x.id===editId);
    if(e){ Object.assign(e,{date,time,text,context,edited:Date.now()}); }
    toast('Eintrag aktualisiert.');
    exitEditMode();
  }else{
    entries.push({ id:uid(), date, time, context, text, created:Date.now() });
    toast('Eintrag gespeichert.');
  }
  if(context) localStorage.setItem(LS_LASTCTX, context);
  save();
  $('fText').value = '';
  setNow();
  $('fCtx').value = context;          // Kontext bleibt für Folgeeinträge stehen
  refreshCtxUI();
  render();
}

function editEntry(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  editId = id;
  $('fDate').value = e.date;
  $('fTime').value = e.time;
  $('fCtx').value  = e.context || '';
  $('fText').value = e.text;
  $('saveBtn').textContent = '💾 Änderung speichern';
  $('editorCard').classList.add('editing');
  render();
  window.scrollTo({top:0,behavior:'smooth'});
  $('fText').focus();
}
function exitEditMode(){
  editId = null;
  $('saveBtn').textContent = '💾 Speichern';
  $('editorCard').classList.remove('editing');
}
function cancelEdit(){
  exitEditMode();
  $('fText').value = '';
  $('fCtx').value = localStorage.getItem(LS_LASTCTX) || '';
  setNow();
  render();
  toast('Bearbeitung abgebrochen.');
}
function clearEditor(){
  exitEditMode();
  $('fText').value = '';
  $('fCtx').value = '';
  setNow();
  render();
}

/* ============ Löschen (mit Undo) ============ */
function delEntry(id){
  const idx = entries.findIndex(x=>x.id===id);
  if(idx<0) return;
  undoBuffer = { entry: entries[idx], idx };
  entries.splice(idx,1);
  if(editId===id) cancelEdit();
  save(); refreshCtxUI(); render();
  toast('Eintrag gelöscht.', 'Rückgängig', undoDelete);
}
function undoDelete(){
  if(!undoBuffer) return;
  entries.splice(undoBuffer.idx, 0, undoBuffer.entry);
  undoBuffer = null;
  save(); refreshCtxUI(); render();
  toast('Wiederhergestellt.');
}

/* ============ Kontext global umbenennen / löschen ============ */
function renameContext(oldCtx){
  const neu = prompt(`Kontext umbenennen:\n(leer lassen = Kontext von allen betroffenen Einträgen entfernen)`, oldCtx);
  if(neu === null) return;
  const target = normCtx(neu);
  const affected = entries.filter(e => normCtx(e.context).toLowerCase() === oldCtx.toLowerCase());
  affected.forEach(e => e.context = target);
  save(); refreshCtxUI(); render();
  toast(target ? `${affected.length} Eintrag/Einträge → „${target}".` : `Kontext bei ${affected.length} Eintrag/Einträgen entfernt.`);
}

/* ============ Rendern ============ */
function visibleEntries(){
  let items = entries.slice();
  const q = $('search').value.trim().toLowerCase();
  if(q) items = items.filter(e =>
    e.text.toLowerCase().includes(q) ||
    (e.context||'').toLowerCase().includes(q) ||
    e.date.includes(q));

  const f = $('ctxFilter').value;
  if(f === '__none__')      items = items.filter(e => !normCtx(e.context));
  else if(f && f !== '__all__') items = items.filter(e => normCtx(e.context).toLowerCase() === f.toLowerCase());

  items.sort((a,b)=>{
    const d = stampOf(a) - stampOf(b);
    return $('sort').value === 'asc' ? d : -d;
  });
  return items;
}

function render(){
  const items = visibleEntries();
  const listEl = $('list');
  listEl.innerHTML = '';

  $('count').textContent = entries.length
    ? `${items.length} von ${entries.length} Eintrag/Einträgen · ${allContexts().length} Kontext(e)`
    : '';

  if(!items.length){
    listEl.innerHTML = `<div class="empty">${entries.length ? 'Keine Einträge gefunden.' : 'Noch keine Einträge im Logbuch.'}</div>`;
    return;
  }

  let lastDay = null;
  items.forEach(e=>{
    const dt = stampOf(e);
    if(e.date !== lastDay){
      const h = document.createElement('div');
      h.className = 'daygroup';
      h.textContent = fmtDate(dt);
      listEl.appendChild(h);
      lastDay = e.date;
    }
    listEl.appendChild(noteCard(e, dt));
  });
}

function noteCard(e, dt){
  const el = document.createElement('div');
  el.className = 'note' + (e.id===editId ? ' isediting' : '');
  const ctx = normCtx(e.context);
  if(ctx) el.style.borderLeftColor = ctxColor(ctx).line;

  const ctxHtml = ctx
    ? `<span class="ctxtag" data-act="filter" title="Nach diesem Kontext filtern"
             style="background:${ctxColor(ctx).bg};color:${ctxColor(ctx).fg}">◆ ${escapeHtml(ctx)}</span>`
    : '';

  el.innerHTML = `
    <div class="nbody">
      <div class="nmeta">
        <span>🕒 ${fmtTime(dt)} Uhr</span>
        ${ctxHtml}
        ${e.edited ? '<span>· bearbeitet</span>' : ''}
      </div>
      <div class="ntext">${escapeHtml(e.text)}</div>
    </div>
    <div class="nactions">
      <button class="iconbtn" data-act="edit" title="Bearbeiten">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button class="iconbtn del" data-act="del" title="Löschen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
      </button>
    </div>`;

  el.querySelector('[data-act=edit]').onclick = ()=>editEntry(e.id);
  el.querySelector('[data-act=del]').onclick  = ()=>delEntry(e.id);
  const tag = el.querySelector('[data-act=filter]');
  if(tag) tag.onclick = ()=>{ $('ctxFilter').value = ctx; render(); };
  return el;
}

/* ============ Kontext-UI aktualisieren ============ */
function refreshCtxUI(){
  const ctxs = allContexts();

  // datalist
  $('ctxList').innerHTML = ctxs.map(c=>`<option value="${escapeHtml(c)}">`).join('');

  // Schnellwahl-Chips (max. 8 häufigste)
  const freq = {};
  entries.forEach(e=>{ const c=normCtx(e.context); if(c) freq[c]=(freq[c]||0)+1; });
  const top = Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,8);
  $('ctxChips').innerHTML = top.map(c=>{
    const col = ctxColor(c);
    return `<span class="chip" data-ctx="${escapeHtml(c)}" style="color:${col.fg};border-color:${col.bg}">${escapeHtml(c)}</span>`;
  }).join('');
  $('ctxChips').querySelectorAll('.chip').forEach(ch=>{
    ch.onclick = ()=>{ $('fCtx').value = ch.dataset.ctx; $('fText').focus(); };
  });

  // Filter-Dropdown (Auswahl beibehalten)
  const prev = $('ctxFilter').value;
  $('ctxFilter').innerHTML =
    `<option value="__all__">Alle Kontexte</option>` +
    ctxs.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)} (${freq[c]})</option>`).join('') +
    `<option value="__none__">${NO_CTX}</option>` +
    (ctxs.length ? `<option value="__rename__">⚙️ Kontext umbenennen …</option>` : '');
  $('ctxFilter').value = [...$('ctxFilter').options].some(o=>o.value===prev) ? prev : '__all__';
}

/* ============ Export / Import ============ */
function download(content, filename, type){
  const blob = new Blob([content],{type:type+';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
const today = ()=> new Date().toISOString().slice(0,10);

function exportJson(){
  const payload = { app:'Logbuch', version:2, exportedAt:new Date().toISOString(), count:entries.length, data:entries };
  download(JSON.stringify(payload,null,2), `logbuch-backup_${today()}.json`, 'application/json');
  toast(`Backup exportiert: ${entries.length} Eintrag/Einträge.`);
}
function exportTxt(){
  const items = visibleEntries().slice().sort((a,b)=>stampOf(a)-stampOf(b));
  const txt = items.map(e=>`[${e.date} ${e.time}]${e.context?' ['+e.context+']':''}\n${e.text}\n`).join('\n');
  download(txt || 'Keine Einträge.', `logbuch_${today()}.txt`, 'text/plain');
  toast(`${items.length} Eintrag/Einträge als TXT exportiert.`);
}
function exportCsv(){
  const items = visibleEntries().slice().sort((a,b)=>stampOf(a)-stampOf(b));
  const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const rows = [['Datum','Uhrzeit','Kontext','Notiz'].map(esc).join(';')]
    .concat(items.map(e=>[e.date,e.time,e.context||'',e.text].map(esc).join(';')));
  download('\uFEFF'+rows.join('\r\n'), `logbuch_${today()}.csv`, 'text/csv');
  toast(`${items.length} Eintrag/Einträge als CSV exportiert.`);
}

function triggerImport(){ $('importFile').value=''; $('importFile').click(); }
function handleImportFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev2=>{
    try{
      const parsed = JSON.parse(ev2.target.result);
      const arr = Array.isArray(parsed) ? parsed : parsed.data;
      if(!Array.isArray(arr)) throw new Error('Kein gültiges Logbuch-Backup.');

      const clean = arr
        .filter(x => x && typeof x.text === 'string')
        .map(x => ({
          id: x.id || uid(),
          date: x.date || today(),
          time: x.time || '00:00',
          context: normCtx(x.context),
          text: x.text,
          created: x.created || Date.now(),
          edited: x.edited
        }));
      if(!clean.length) throw new Error('Die Datei enthält keine Einträge.');

      const merge = confirm(
        `${clean.length} Eintrag/Einträge gefunden.\n\n` +
        `OK = zu bestehenden ${entries.length} Einträgen HINZUFÜGEN (Duplikate werden übersprungen)\n` +
        `Abbrechen = bestehende Einträge ERSETZEN`);

      if(merge){
        const seen = new Set(entries.map(x => `${x.date}|${x.time}|${x.text}`));
        const ids  = new Set(entries.map(x => x.id));
        let added = 0, skipped = 0;
        clean.forEach(n=>{
          const key = `${n.date}|${n.time}|${n.text}`;
          if(seen.has(key)){ skipped++; return; }
          if(ids.has(n.id)) n.id = uid();
          seen.add(key); ids.add(n.id);
          entries.push(n); added++;
        });
        toast(`Import: ${added} hinzugefügt, ${skipped} Duplikat(e) übersprungen.`);
      }else{
        if(!confirm(`Wirklich alle ${entries.length} aktuellen Einträge ersetzen?\nTipp: vorher ein Backup exportieren.`)) return;
        entries = clean;
        toast(`Import: ${clean.length} Eintrag/Einträge geladen.`);
      }
      save(); refreshCtxUI(); render();
      openList(true);
    }catch(err){ alert('Import fehlgeschlagen: '+err.message); }
  };
  reader.readAsText(file);
}

/* ============ Toast ============ */
let toastTimer;
function toast(msg, actionLabel, actionFn){
  const el = $('toast');
  el.innerHTML = `<span>${escapeHtml(msg)}</span>`;
  if(actionLabel){
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.onclick = ()=>{ el.classList.remove('show'); actionFn && actionFn(); };
    el.appendChild(b);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), actionLabel ? 6000 : 2600);
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ Events ============ */
function openList(force){
  const sec = $('listSection');
  const open = force ? (sec.classList.add('show'), true) : sec.classList.toggle('show');
  $('toggleListBtn').textContent = open ? '📕 Notizen ausblenden' : '📖 Notizen anzeigen';
  if(open){ render(); sec.scrollIntoView({behavior:'smooth',block:'start'}); }
}

$('saveBtn').onclick       = saveEntry;
$('nowBtn').onclick        = ()=>{ setNow(); toast('Auf aktuelle Zeit gesetzt.'); };
$('clearBtn').onclick      = clearEditor;
$('cancelEditBtn').onclick = cancelEdit;
$('toggleListBtn').onclick = ()=>openList(false);
$('search').oninput        = render;
$('sort').onchange         = render;
$('ctxFilter').onchange    = e=>{
  if(e.target.value === '__rename__'){
    e.target.value = '__all__';
    const ctxs = allContexts();
    const pick = prompt('Welchen Kontext möchtest du umbenennen?\n\n' + ctxs.map((c,i)=>`${i+1}. ${c}`).join('\n') + '\n\nNummer oder Name eingeben:');
    if(pick===null) return;
    const byNum = ctxs[parseInt(pick,10)-1];
    const target = byNum || ctxs.find(c=>c.toLowerCase()===normCtx(pick).toLowerCase());
    if(!target){ alert('Kontext nicht gefunden.'); return; }
    renameContext(target);
    return;
  }
  render();
};
$('exportBtn').onclick     = exportJson;
$('exportTxtBtn').onclick  = exportTxt;
$('exportCsvBtn').onclick  = exportCsv;
$('importBtn').onclick     = triggerImport;
$('importFile').onchange   = handleImportFile;
$('fText').addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='Enter') saveEntry();
});
$('fCtx').addEventListener('blur', ()=>{ $('fCtx').value = canonicalCtx($('fCtx').value); });

/* ============ PWA ============ */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt = e;
  $('installBtn').style.display = 'inline-block';
});
$('installBtn').onclick = async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $('installBtn').style.display = 'none';
};
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ============ Init ============ */
setNow();
$('fCtx').value = localStorage.getItem(LS_LASTCTX) || '';
refreshCtxUI();
render();
</script>
